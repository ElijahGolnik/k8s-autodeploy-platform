name: Build and Deploy to Kubernetes

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"

      # Build and push backend
      - name: Build Backend Image
        run: |
          docker build \
            -t elijahgolnik/backend-multistage:${IMAGE_TAG} \
            ./backend

      - name: Push Backend Image
        run: |
          docker push elijahgolnik/backend-multistage:${IMAGE_TAG}

      # Build and push frontend
      - name: Build Frontend Image
        run: |
          docker build \
            -t elijahgolnik/frontend:${IMAGE_TAG} \
            ./frontend

      - name: Push Frontend Image
        run: |
          docker push elijahgolnik/frontend:${IMAGE_TAG}

      

      # Configure Kubernetes
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Verify Kubernetes tools
        run: |
          kubectl config current-context
          kubectl get nodes
          kustomize version

      - name: Set Kubeconfig
        run: echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"

      # Confirm which cluster receives the deployment
      - name: Verify Kubernetes Connection
        run: |
          kubectl config current-context
          kubectl get nodes
          kubectl get deployments -A

      - name: Configure deployment images
        run: |
          kustomize edit set image \
            elijahgolnik/backend-multistage=elijahgolnik/backend-multistage:${IMAGE_TAG}

          kustomize edit set image \
            elijahgolnik/frontend=elijahgolnik/frontend:${IMAGE_TAG}

      - name: Deploy with Kustomize
        run: |
          kubectl apply -k .

      - name: Verify deployments
        run: |
          kubectl rollout status deployment/backend --timeout=180s
          kubectl rollout status deployment/frontend --timeout=180s

          kubectl get deployments
          kubectl get pods
          kubectl get ingress

      

        
            

        